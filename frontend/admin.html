<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#060913" />
  <title>Lysandra · Admin</title>
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- ========== LOGIN SCREEN ========== -->
  <div id="loginScreen" class="login-wrap">
    <form id="loginForm" class="login-card glass" autocomplete="off">
      <img src="assets/icon.png" alt="Lysandra" class="login-logo" />
      <h1>Admin Login</h1>
      <p class="login-sub">Lysandra Control Panel</p>

      <label class="fld">
        <span>Username</span>
        <input id="lgUser" type="text" required autocapitalize="off" autocorrect="off" spellcheck="false" />
      </label>
      <label class="fld">
        <span>Password</span>
        <input id="lgPass" type="password" required />
      </label>

      <button class="btn-primary" type="submit" id="lgBtn">Sign In</button>
      <div class="login-err hidden" id="lgErr"></div>
      <div class="login-note">
        After 3 failed attempts, this device is blocked.
      </div>
    </form>
  </div>

  <!-- ========== APP SHELL (after login) ========== -->
  <div id="adminApp" class="admin-app hidden">

    <!-- Sidebar -->
    <aside class="admin-side">
      <div class="side-head">
        <img src="assets/icon.png" alt="" />
        <div>
          <div class="side-title">Lysandra</div>
          <div class="side-sub">ADMIN</div>
        </div>
      </div>

      <nav class="side-nav" id="sideNav">
        <a href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#/carousel" data-route="carousel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m9 10 4 2-4 2z"/></svg>
          <span>Carousel</span>
        </a>
        <a href="#/dialogs" data-route="dialogs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V5a2 2 0 0 1 2-2h12a4 4 0 0 1 4 4z"/></svg>
          <span>Dialogs</span>
        </a>
        <a href="#/pages" data-route="pages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span>Pages</span>
        </a>
        <a href="#/logs" data-route="logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 4 4 5-5"/></svg>
          <span>Logs</span>
        </a>
        <a href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="side-foot">
        <button class="side-logout" id="btnLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="icon-btn" id="btnSideToggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-right">
          <span class="whoami" id="whoami"></span>
        </div>
      </header>

      <section class="admin-view" id="adminView"></section>
    </main>
  </div>

  <!-- ========== MODAL ========== -->
  <div id="adminModal" class="admin-modal-back hidden">
    <div class="admin-modal glass">
      <div class="admin-modal-head">
        <div class="admin-modal-title" id="amTitle">Edit</div>
        <button class="icon-btn" id="amClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="admin-modal-body" id="amBody"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
